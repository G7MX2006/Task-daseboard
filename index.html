<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard Pro</title>
    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body,
        .navbar,
        .card,
        .modal-content,
        .form-control,
        .form-select,
        .badge {
            transition: all 0.3s ease;
        }

        .app-container {
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body class="bg-body text-body min-vh-100 pb-5">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm mb-4">
        <div class="container app-container py-1">

            <!-- Brand -->
            <a class="navbar-brand mb-0 h4 fw-bold d-flex align-items-center gap-2 text-decoration-none text-body"
                href="#">
                <i class="bi bi-list-check fs-3 text-primary"></i>
                <span>Task Dashboard</span>
            </a>

            <!-- Hamburger Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible Content -->
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">

                <!-- Search Input -->
                <div class="w-100 mx-lg-auto my-2 my-lg-0" style="max-width: 320px;">
                    <div class="input-group">
                        <span class="input-group-text bg-body-secondary text-body border-secondary-subtle">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="searchInput"
                            class="form-control bg-body-tertiary text-body border-secondary-subtle"
                            placeholder="Search tasks...">
                    </div>
                </div>

                <!-- Right Actions -->
                <div
                    class="d-flex flex-column flex-sm-row align-items-stretch align-items-lg-center gap-2 pt-2 pt-lg-0 ms-lg-auto">

                    <!-- Add Task Button -->
                    <button type="button" id="addNewTaskBtn"
                        class="btn btn-primary text-nowrap d-flex align-items-center justify-content-center gap-1"
                        data-bs-toggle="modal" data-bs-target="#taskModal">
                        <i class="bi bi-plus-lg"></i>
                        <span>Add New Task</span>
                    </button>

                    <!-- Theme Toggle & Profile -->
                    <div
                        class="d-flex align-items-center justify-content-between justify-content-sm-start gap-2 mt-2 mt-sm-0">
                        <button type="button" id="themeToggleBtn"
                            class="btn btn-outline-secondary text-body rounded-circle d-flex align-items-center justify-content-center p-0 flex-shrink-0"
                            style="width: 38px; height: 38px;" title="Toggle Theme">
                            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                        </button>

                        <a href="#" class="d-inline-block flex-shrink-0 ms-1" title="User Profile">
                            <img src="https://i.pravatar.cc/100" alt="User Profile"
                                class="rounded-circle border border-2 border-primary p-1 bg-body-tertiary"
                                style="width: 40px; height: 40px; object-fit: cover;">
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </nav>

    <!-- Main Container -->
    <div class="container app-container my-4">

        <!-- 1. KPI Cards Section -->
        <div class="row g-3 mb-4">
            <!-- Total Tasks KPI -->
            <div class="col-12 col-sm-4">
                <div
                    class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 d-flex flex-row align-items-center justify-content-between">
                    <div>
                        <span class="text-body-secondary small fw-medium d-block">Total Tasks</span>
                        <h2 class="fw-bold mb-0 mt-1" id="totalCount">0</h2>
                    </div>
                    <div class="bg-primary-subtle text-primary rounded-circle p-3 d-flex align-items-center justify-content-center"
                        style="width: 48px; height: 48px;">
                        <i class="bi bi-list-task fs-4"></i>
                    </div>
                </div>
            </div>

            <!-- Completed KPI -->
            <div class="col-12 col-sm-4">
                <div
                    class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 d-flex flex-row align-items-center justify-content-between">
                    <div>
                        <span class="text-success small fw-medium d-block">Completed</span>
                        <h2 class="fw-bold text-success mb-0 mt-1" id="completedCount">0</h2>
                    </div>
                    <div class="bg-success-subtle text-success rounded-circle p-3 d-flex align-items-center justify-content-center"
                        style="width: 48px; height: 48px;">
                        <i class="bi bi-check-circle-fill fs-4"></i>
                    </div>
                </div>
            </div>

            <!-- Pending KPI -->
            <div class="col-12 col-sm-4">
                <div
                    class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 d-flex flex-row align-items-center justify-content-between">
                    <div>
                        <span class="text-warning-emphasis small fw-medium d-block">Pending</span>
                        <h2 class="fw-bold text-warning-emphasis mb-0 mt-1" id="pendingCount">0</h2>
                    </div>
                    <div class="bg-warning-subtle text-warning-emphasis rounded-circle p-3 d-flex align-items-center justify-content-center"
                        style="width: 48px; height: 48px;">
                        <i class="bi bi-clock-history fs-4"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Filters & Sorting Toolbar -->
        <div class="card bg-body-tertiary border-0 shadow-sm p-3 mb-4 rounded-3">
            <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
                    <i class="bi bi-funnel text-primary"></i> Filter & Sort
                </h6>
                <div class="d-flex flex-wrap gap-2 w-100 w-md-auto ms-auto">
                    <!-- Status Filter -->
                    <select id="statusFilter"
                        class="form-select form-select-sm w-auto bg-body text-body border-secondary-subtle">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>

                    <!-- Priority Filter -->
                    <select id="priorityFilter"
                        class="form-select form-select-sm w-auto bg-body text-body border-secondary-subtle">
                        <option value="All">All Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>

                    <!-- Sort Select -->
                    <select id="sortSelect"
                        class="form-select form-select-sm w-auto bg-body text-body border-secondary-subtle">
                        <option value="newest">Newest First</option>
                        <option value="dueDate">Due Date</option>
                        <option value="priority">Priority</option>
                    </select>

                    <!-- Clear Completed -->
                    <button id="clearCompletedBtn"
                        class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1">
                        <i class="bi bi-trash3"></i> Clear Done
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Visual Analytics Charts -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-6">
                <div class="card bg-body-tertiary border-0 shadow-sm p-3 h-100">
                    <h6 class="fw-bold mb-3 text-center text-md-start">Task Completion Status</h6>
                    <div style="position: relative; height: 200px;">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card bg-body-tertiary border-0 shadow-sm p-3 h-100">
                    <h6 class="fw-bold mb-3 text-center text-md-start">Tasks by Priority</h6>
                    <div style="position: relative; height: 200px;">
                        <canvas id="priorityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Task Modal -->
        <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="taskModalLabel">Add New Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="titleInput" class="form-label">Title</label>
                                <input type="text" class="form-control" id="titleInput" required>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="priorityInput" class="form-label">Priority</label>
                                    <select class="form-select" id="priorityInput">
                                        <option value="High">High</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="Low">Low</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="dueDateInput" class="form-label">Due Date</label>
                                    <input type="date" class="form-control" id="dueDateInput">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="disInput" class="form-label">Description</label>
                                <textarea class="form-control" id="disInput" rows="3"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success flex-grow-1" id="submitTaskBtn">Save
                                    Task</button>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Tasks Container -->
        <div class="row g-3" id="tasksContainer"></div>

    </div>

    <!-- Floating Action Button (FAB) -->
    <button type="button" id="fabAddTaskBtn"
        class="btn btn-primary rounded-circle shadow-lg position-fixed d-flex align-items-center justify-content-center p-0"
        style="bottom: 25px; right: 25px; width: 56px; height: 56px; z-index: 1050;" data-bs-toggle="modal"
        data-bs-target="#taskModal" title="Add New Task">
        <i class="bi bi-plus-lg fs-3"></i>
    </button>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this task?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS & External JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
