<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Task Manager</title>
    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body, .navbar, .card { transition: all 0.3s ease; }
        .app-container { max-width: 1200px; margin: 0 auto; }
    </style>
</head>

<body class="bg-body text-body min-vh-100 pb-5">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm mb-4">
        <div class="container app-container py-1">

            <!-- Brand -->
            <a class="navbar-brand mb-0 h4 fw-bold d-flex align-items-center gap-2 text-decoration-none text-body" href="index.html">
                <i class="bi bi-list-check fs-3 text-primary"></i>
                <span>Task Manager</span>
            </a>

            <!-- Hamburger Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links & Profile Actions -->
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarContent">
                
                <ul class="navbar-nav mx-lg-auto mb-2 mb-lg-0 gap-1 gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary" href="index.html">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-body-secondary" href="tasks.html">
                            <i class="bi bi-card-checklist me-1"></i> Tasks
                        </a>
                    </li>
                </ul>

                <!-- User Profile & Actions -->
                <div class="d-flex align-items-center justify-content-between justify-content-sm-start gap-2">
                    <button type="button" id="themeToggleBtn" class="btn btn-outline-secondary text-body rounded-circle d-flex align-items-center justify-content-center p-0 flex-shrink-0" style="width: 38px; height: 38px;" title="Toggle Theme">
                        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                    </button>

                    <a href="#" class="d-inline-block flex-shrink-0 ms-1" title="User Profile">
                        <img src="https://i.pravatar.cc/100" alt="User Profile" class="rounded-circle border border-2 border-primary p-1 bg-body-tertiary" style="width: 40px; height: 40px; object-fit: cover;">
                    </a>

                    <button type="button" id="logoutBtn" class="btn btn-sm btn-outline-danger ms-2 d-flex align-items-center gap-1">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>

            </div>

        </div>
    </nav>

    <!-- Main Dashboard Area -->
    <div class="container app-container my-4">
        
        <div class="row g-4">

            <!-- Sidebar Filters -->
            <div class="col-12 col-lg-3">
                <div class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 sticky-lg-top" style="top: 1rem; z-index: 10;">
                    <h6 class="fw-bold mb-3 d-flex align-items-center gap-2">
                        <i class="bi bi-funnel-fill text-primary"></i> Analytics Filters
                    </h6>
                    
                    <div class="mb-3">
                        <label for="dashPriorityFilter" class="form-label small text-body-secondary fw-semibold">Priority</label>
                        <select id="dashPriorityFilter" class="form-select form-select-sm bg-body text-body border-secondary-subtle">
                            <option value="All">All Priorities</option>
                            <option value="High">High Priority</option>
                            <option value="Medium">Medium Priority</option>
                            <option value="Low">Low Priority</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="dashDateFilter" class="form-label small text-body-secondary fw-semibold">Timeframe</label>
                        <select id="dashDateFilter" class="form-select form-select-sm bg-body text-body border-secondary-subtle">
                            <option value="all">All Time</option>
                            <option value="overdue">Overdue Tasks</option>
                            <option value="today">Due Today</option>
                        </select>
                    </div>

                    <button id="resetDashFiltersBtn" class="btn btn-sm btn-outline-secondary w-100 mt-2 d-flex align-items-center justify-content-center gap-1">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset Filters
                    </button>
                </div>
            </div>

            <!-- Main Analytics Content -->
            <div class="col-12 col-lg-9">
                
                <!-- KPI Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-sm-4">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 d-flex flex-row align-items-center justify-content-between">
                            <div>
                                <span class="text-body-secondary small fw-medium d-block">Total Tasks</span>
                                <h2 class="fw-bold mb-0 mt-1" id="totalCount">0</h2>
                            </div>
                            <div class="bg-primary-subtle text-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-list-task fs-4"></i>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-4">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 d-flex flex-row align-items-center justify-content-between">
                            <div>
                                <span class="text-success small fw-medium d-block">Completed</span>
                                <h2 class="fw-bold text-success mb-0 mt-1" id="completedCount">0</h2>
                            </div>
                            <div class="bg-success-subtle text-success rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-check-circle-fill fs-4"></i>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-4">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 rounded-3 d-flex flex-row align-items-center justify-content-between">
                            <div>
                                <span class="text-warning-emphasis small fw-medium d-block">Pending</span>
                                <h2 class="fw-bold text-warning-emphasis mb-0 mt-1" id="pendingCount">0</h2>
                            </div>
                            <div class="bg-warning-subtle text-warning-emphasis rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-clock-history fs-4"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4 Charts Grid -->
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 h-100">
                            <h6 class="fw-bold mb-3 text-center text-md-start"><i class="bi bi-pie-chart-fill text-primary me-1"></i> Completion Status</h6>
                            <div style="position: relative; height: 210px;"><canvas id="statusChart"></canvas></div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 h-100">
                            <h6 class="fw-bold mb-3 text-center text-md-start"><i class="bi bi-bar-chart-fill text-warning me-1"></i> Tasks by Priority</h6>
                            <div style="position: relative; height: 210px;"><canvas id="priorityChart"></canvas></div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 h-100">
                            <h6 class="fw-bold mb-3 text-center text-md-start"><i class="bi bi-calendar-range-fill text-danger me-1"></i> Timeline Health</h6>
                            <div style="position: relative; height: 210px;"><canvas id="timelineChart"></canvas></div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card bg-body-tertiary border-0 shadow-sm p-3 h-100">
                            <h6 class="fw-bold mb-3 text-center text-md-start"><i class="bi bi-ui-checks-grid text-info me-1"></i> Priority Progress</h6>
                            <div style="position: relative; height: 210px;"><canvas id="progressMatrixChart"></canvas></div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
