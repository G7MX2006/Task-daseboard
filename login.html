<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Manager</title>
    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body, .card { transition: all 0.3s ease; }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>

<body class="bg-body text-body min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="card login-card border-0 shadow-lg bg-body-tertiary p-4 rounded-4">
        <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width: 60px; height: 60px;">
                <i class="bi bi-list-check fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">Welcome Back</h4>
            <p class="text-body-secondary small">Sign in to access your Task Manager</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-semibold">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-body border-secondary-subtle"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-body border-secondary-subtle" id="loginEmail" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="loginPassword" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-body border-secondary-subtle"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-body border-secondary-subtle" id="loginPassword" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 mt-4">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
